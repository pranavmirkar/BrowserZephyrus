<style include="cr-shared-style settings-shared">
  /* M3 Expressive. The page opens on a hero card with what the blocker has
     done, the switches become icon rows (the tonal circles come from
     settings-toggle-button itself, see its stylesheet), and the allowlist is a
     row of input chips instead of a bare list. Colours are the --color-sys-*
     roles from chrome://theme/colors.css, i.e. the browser's own scheme. */
  #hero {
    align-items: center;
    background: var(--color-sys-primary-container);
    border-radius: 28px;
    color: var(--color-sys-on-primary-container);
    display: flex;
    gap: 20px;
    margin: var(--cr-section-vertical-margin) auto 0;
    padding: 24px;
  }

  /* Off is not an error, so it is neutral rather than red: the page must not
     nag a user who turned blocking off on purpose. */
  #hero[off] {
    background: var(--color-zephyrus-surface-container-high);
    color: var(--color-sys-on-surface);
  }

  #badge {
    flex: none;
    height: 72px;
    width: 72px;
  }

  #badge .shape {
    fill: var(--color-sys-primary);
  }

  #badge .glyph {
    fill: var(--color-sys-on-primary);
  }

  #hero[off] #badge .shape {
    fill: var(--color-zephyrus-surface-container-highest);
  }

  #hero[off] #badge .glyph {
    fill: var(--color-sys-on-surface-variant);
  }

  #heroCount {
    font-size: 45px;
    font-variant-numeric: tabular-nums;
    line-height: 52px;
  }

  #heroLabel {
    font-size: 16px;
    line-height: 24px;
  }

  #heroRules {
    font-size: 14px;
    line-height: 20px;
    margin-top: 8px;
  }

  #hero[off] #heroRules {
    color: var(--color-sys-on-surface-variant);
  }

  #allowlist {
    padding: 0 var(--cr-section-padding) var(--cr-section-vertical-padding);
  }

  #addRow {
    align-items: center;
    display: flex;
    gap: 8px;
  }

  /* A filled M3 text field, full-round to sit with the search bar above it
     rather than the underlined field the settings pages default to. */
  #addRow cr-input {
    --cr-input-background-color: var(--color-zephyrus-surface-container-highest);
    --cr-input-border-radius: 24px;
    --cr-input-min-height: 48px;
    --cr-input-padding-start: 20px;
    --cr-input-padding-end: 20px;
    --cr-input-border-bottom: none;
    --cr-input-underline-display: none;
    --cr-input-width: 100%;
    flex: 1;
  }

  #addRow cr-button {
    --cr-button-height: 40px;
    border-radius: 20px;
  }

  #chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  /* The flex display above would otherwise beat the [hidden] attribute. */
  #chips[hidden] {
    display: none;
  }

  /* M3 input chip: 32dp, 8dp corners, outlined, trailing remove. */
  .chip {
    align-items: center;
    border: 1px solid var(--color-zephyrus-outline-variant,
        var(--cr-separator-color));
    border-radius: 8px;
    box-sizing: border-box;
    display: inline-flex;
    gap: 2px;
    min-height: 32px;
    padding-inline: 12px 4px;
  }

  .chip span {
    overflow-wrap: anywhere;
  }

  .chip cr-icon-button {
    --cr-icon-button-icon-size: 16px;
    --cr-icon-button-size: 24px;
    margin: 0;
  }

  #empty {
    color: var(--cr-secondary-text-color);
    margin-top: 16px;
  }
</style>

  </svg>
  <div>
    <template is="dom-if" if="[[prefs.zephyrus.adblock.enabled.value]]">
      <div id="heroCount">[[blockedText_]]</div>
      <div id="heroLabel">$i18n{zephyrusAdblockHeroBlocked}</div>
    </template>
    <template is="dom-if" if="[[!prefs.zephyrus.adblock.enabled.value]]">
      <div id="heroLabel">$i18n{zephyrusAdblockHeroOff}</div>
    </template>
    <div id="heroRules">[[rulesText_]]</div>
  </div>
</div>

<settings-section page-title="$i18n{zephyrusAdblockSectionTitle}"
    class="cr-centered-card-container">
  <settings-toggle-button
      id="enabledToggle"
      icon="settings20:shield"
      pref="{{prefs.zephyrus.adblock.enabled}}"
      label="$i18n{zephyrusAdblockEnabledLabel}"
      sub-label="$i18n{zephyrusAdblockEnabledSubLabel}">
  </settings-toggle-button>

  <settings-toggle-button
      id="popupToggle"
      class="hr"
      icon="settings:block"
      pref="{{prefs.zephyrus.adblock.aggressive_popup}}"
      label="$i18n{zephyrusAdblockPopupLabel}"
      sub-label="$i18n{zephyrusAdblockPopupSubLabel}">
  </settings-toggle-button>
</settings-section>

<settings-section page-title="$i18n{zephyrusAdblockAllowlistLabel}"
    class="cr-centered-card-container">
  <div class="cr-row first">
    <div class="flex cr-padded-text">
      <div class="secondary">$i18n{zephyrusAdblockAllowlistSubLabel}</div>
    </div>
  </div>
  <div id="allowlist">
    <div id="addRow">
      <cr-input value="{{newDomain_}}"
          placeholder="$i18n{zephyrusAdblockAllowlistPlaceholder}"
          aria-label="$i18n{zephyrusAdblockAllowlistLabel}"
          on-keydown="onDomainKeydown_">
      </cr-input>
      <cr-button class="tonal-button" on-click="onAddDomain_">
        $i18n{zephyrusAdblockAdd}
      </cr-button>
    </div>

    <template is="dom-if" if="[[allowlistEmpty_]]">
      <div id="empty">$i18n{zephyrusAdblockAllowlistEmpty}</div>
    </template>

    <div id="chips" hidden="[[allowlistEmpty_]]">
      <template is="dom-repeat"
          items="[[prefs.zephyrus.adblock.allowlist.value]]">
        <span class="chip">
          <span>[[item]]</span>
          <cr-icon-button iron-icon="cr:clear" on-click="onRemoveDomain_"
              title="$i18n{zephyrusAdblockRemove}"
              aria-label="[[removeLabel_(item)]]">
          </cr-icon-button>
        </span>
      </template>
    </div>
  </div>
</settings-section>

<settings-section page-title="$i18n{zephyrusResetIdsSectionTitle}"
    class="cr-centered-card-container">
  <settings-toggle-button
      id="resetIdsToggle"
      icon="settings20:id-card"
      pref="{{prefs.zephyrus.privacy.auto_reset_ids}}"
      label="$i18n{zephyrusResetIdsLabel}"
      sub-label="$i18n{zephyrusResetIdsSubLabel}">
  </settings-toggle-button>
</settings-section>
