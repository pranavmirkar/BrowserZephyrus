<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <style>
    /* Zephyrus has no new-tab page, and no second empty state.
       The empty window is painted natively (zephyrus_empty_background.cc);
       this page exists only so the chrome://newtab URL is not broken for
       anything that still resolves it. It deliberately renders NOTHING but
       the same flat colour that native paints before a wallpaper arrives --
       #FFFAF0, the one permanent Zephyrus colour. No wallpaper layer, no
       search field, no shortcuts, no branding, no script. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fffaf0;
      overflow: hidden;
    }
  </style>
</head>
<body></body>
</html>
