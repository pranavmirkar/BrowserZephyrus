[package]
name = "brave_compare"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
adblock = "0.13"        # Brave's engine (adblock-rust); crates.io
memory-stats = "1"      # working set, for the head-to-head
seahash = "4.1.0"        # to repair the checksum of a rewritten engine blob (bin corrupt)

[[bin]]
name = "brave_cmp"      # speed and memory on the 20,000-request synthetic corpus
path = "src/main.rs"

[[bin]]
name = "cross"          # decisions that differ across probes derived from every rule
path = "src/bin_cross.rs"

[[bin]]
name = "real"           # speed and verdicts on recorded page traffic
path = "src/bin_real.rs"

[[bin]]
name = "h2h"             # Brave vs Zephyrus on one list and one recorded corpus, same machine
path = "src/bin_h2h.rs"

[[bin]]
name = "corrupt"        # what a damaged or rewritten engine blob does to Brave (see research/hostile_driver.py)
path = "src/bin_corrupt.rs"

[[bin]]
name = "parity"         # which rule lines Brave's parser keeps
path = "src/bin_parity.rs"

[profile.release]
opt-level = 3
